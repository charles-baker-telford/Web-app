<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/message.css">
    <link rel="stylesheet" href="style/login.css">
    <link href="https://googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="scripts/message.js" defer></script>
    <title>Sign in</title>
    <script>

        const username = 'myUsername';
        const password = 'myPassword123';

        // 1. Format the data into URL-encoded parameters
        const formData = new URLSearchParams();
        formData.append('username', username);
        formData.append('password', password);

        async function  login() {
            try {
                
            // 2. Send the POST request
                const response = await fetch('scripts/login.php', {
                    method: 'POST',
                    headers: {
                        // Tells PHP to parse this into the $_POST array
                        'Content-Type': 'application/x-www-form-urlencoded' 
                    },
                body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const result = await response.json();
                console.log(result);
            
            } catch (error) {
                console.error('Request failed:', error);
            }
        }

    </script>
</head>
<body>
    <dialog open aria-labelledby="login-title" aria-describedby="login-intro">
        <h1 id="login-title">Welcome</h1>
        <p class="intro" id="login-intro">Sign in to your account to continue.</p>

        <form action="#" method="post">
            <div class="field">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="options">
                <div class="remember">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>
                <a href="forgot-password.html">Forgot password?</a>
            </div>

            <button type="submit">Sign in</button>
        </form>

        <p class="signup">Don't have an account? <a href="register.html">Create one</a></p>
    </dialog>
</body>
</html>
